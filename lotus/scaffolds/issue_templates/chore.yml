name: Chore
description: Request a maintenance task (no logic changes)
title: "chore: "
labels: ["lotus:chore"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done? Be exact — the agent will do precisely this.
      placeholder: |
        - Upgrade ruff from 0.4.x to 0.5.x
        - Update the README installation section to reflect the new command
        - Add missing type annotations to src/utils/helpers.py
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this needed?
      placeholder: |
        - ruff 0.5 fixes a false positive we've been suppressing
        - README is outdated since the CLI was renamed
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: |
        Which files or directories should be touched? What is explicitly out of scope?
      placeholder: |
        - Only modify pyproject.toml and requirements-dev.txt
        - Do NOT change any application logic
    validations:
      required: false
